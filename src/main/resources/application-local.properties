# Perfil para desarrollo local.
spring.config.import=optional:file:.env[.properties]

# SQL Server local/remoto utilizado durante el desarrollo.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.sql.init.mode=never

# Frontend permitido durante el desarrollo.
cors.allowOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Seguridad local.
jwt.secret=${JWT_SECRET:agrihusa-integrador-dev-secret-key-2026}
initial-admin.password=${INITIAL_ADMIN_PASSWORD:}