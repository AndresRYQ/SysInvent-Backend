# Perfil para desarrollo local con MySQL 8.
# Activar con: SPRING_PROFILES_ACTIVE=mysql (variable de entorno o archivo .env).
spring.config.import=optional:file:.env[.properties]

# Conexión MySQL. Ejemplo de URL:
# jdbc:mysql://localhost:3306/sysinvent_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sysinvent_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema se crea con src/main/resources/db/mysql/schema_mysql.sql.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never

# Frontend permitido durante el desarrollo.
cors.allowOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Seguridad local.
jwt.secret=${JWT_SECRET:agrihusa-integrador-dev-secret-key-2026}
initial-admin.password=${INITIAL_ADMIN_PASSWORD:}
brevo.enabled=${BREVO_ENABLED:false}
