spring.application.name=SysInvent

# Carga las credenciales locales desde .env si el archivo existe.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SysInvent}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

cors.allowOrigins=http://localhost:3000,http://localhost:5173
cors.allowMethods=GET,POST,PUT,DELETE,OPTIONS
cors.allowHeaders=*
cors.exposedHeaders=Authorization
cors.maxAge=3600
cors.allowCredentials=true
cors.mapping=/**
