spring.application.name=SysInvent
spring.profiles.default=local

server.address=0.0.0.0
server.port=${PORT:8080}

spring.messages.basename=messages/validation
spring.messages.encoding=UTF-8

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

brevo.api-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
brevo.enabled=${BREVO_ENABLED:false}
brevo.api-key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:SysInvent}

cors.allowMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowHeaders=*
cors.exposedHeaders=Authorization
cors.maxAge=3600
cors.allowCredentials=true
cors.mapping=/**
