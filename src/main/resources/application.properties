spring.application.name=SysInvent
spring.messages.basename=messages/validation
spring.messages.encoding=UTF-8

# Carga las credenciales locales desde .env si el archivo existe.
spring.config.import=optional:file:.env[.properties]

# SQL Server.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# JWT.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Credencial opcional para crear el administrador inicial.
initial-admin.password=${INITIAL_ADMIN_PASSWORD:}

cors.allowOrigins=http://localhost:3000,http://localhost:5173
cors.allowMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowHeaders=*
cors.exposedHeaders=Authorization
cors.maxAge=3600
cors.allowCredentials=true
cors.mapping=/**
