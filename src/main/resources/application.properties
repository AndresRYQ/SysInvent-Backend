spring.application.name=SysInvent
spring.messages.basename=messages/validation
spring.messages.encoding=UTF-8

# Carga las credenciales locales desde .env si el archivo existe.
spring.config.import=optional:file:.env[.properties]

# SQL Server. Configuracion anterior conservada para volver a usarla si hace falta.
# spring.datasource.url=${SQLSERVER_DB_URL}
# spring.datasource.username=${SQLSERVER_DB_USER}
# spring.datasource.password=${SQLSERVER_DB_PASSWORD}
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# spring.jpa.hibernate.ddl-auto=none
# spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# SQLite local.
spring.datasource.url=jdbc:sqlite:./src/main/resources/db/sysinvent.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-sqlite.sql

# JWT.
jwt.secret=${JWT_SECRET:SysInvent-dev-secret-key-change-in-production-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

cors.allowOrigins=http://localhost:3000,http://localhost:5173
cors.allowMethods=GET,POST,PUT,DELETE,OPTIONS
cors.allowHeaders=*
cors.exposedHeaders=Authorization
cors.maxAge=3600
cors.allowCredentials=true
cors.mapping=/**
