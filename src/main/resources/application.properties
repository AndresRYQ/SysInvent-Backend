spring.application.name=SysInvent
spring.messages.basename=messages/validation
spring.messages.encoding=UTF-8

# Carga las credenciales locales desde .env si el archivo existe.
spring.config.import=optional:file:.env[.properties]

# SQL Server.
spring.datasource.url=${SQLSERVER_DB_URL}
spring.datasource.username=${SQLSERVER_DB_USER}
spring.datasource.password=${SQLSERVER_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:120000}
spring.datasource.hikari.minimum-idle=${DB_MINIMUM_IDLE:5}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# JWT.
jwt.secret=${JWT_SECRET:SysInvent-dev-secret-key-change-in-production-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

cors.allowOrigins=http://localhost:3000,http://localhost:5173
cors.allowMethods=GET,POST,PUT,DELETE,OPTIONS
cors.allowHeaders=*
cors.exposedHeaders=Authorization
cors.maxAge=3600
cors.allowCredentials=true
cors.mapping=/**
