spring.datasource.url=jdbc:h2:mem:sysinvent;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
jwt.secret=SysInvent-test-secret-key-long-enough-2026
jwt.expiration-ms=3600000
cors.allowOrigins=http://localhost:3000,http://localhost:5173
cors.allowMethods=GET,POST,PUT,DELETE,OPTIONS
cors.allowHeaders=*
cors.exposedHeaders=Authorization
cors.maxAge=3600
cors.allowCredentials=true
cors.mapping=/**
