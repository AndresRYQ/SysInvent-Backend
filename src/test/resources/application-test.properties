# Las pruebas unitarias usan Mockito y no requieren un datasource.

# Seguridad utilizada solamente durante las pruebas.
jwt.secret=SysInvent-test-secret-key-with-at-least-32-bytes
jwt.expiration-ms=3600000
initial-admin.password=

# Brevo permanece deshabilitado durante las pruebas de integración.
brevo.enabled=false
brevo.api-url=https://api.brevo.com/v3/smtp/email
brevo.api-key=
brevo.sender.email=
brevo.sender.name=SysInvent

# CORS para las pruebas.
cors.allowOrigins=http://localhost
cors.allowMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowHeaders=*
cors.exposedHeaders=Authorization
cors.maxAge=3600
cors.allowCredentials=true
cors.mapping=/**
