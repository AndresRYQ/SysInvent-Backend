# Base de datos en memoria exclusiva para las pruebas.
spring.datasource.url=jdbc:h2:mem:sysinvent;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea y elimina las tablas durante las pruebas.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Seguridad utilizada solamente durante las pruebas.
jwt.secret=SysInvent-test-secret-key-with-at-least-32-bytes
jwt.expiration-ms=3600000
initial-admin.password=

# CORS para las pruebas.
cors.allowOrigins=http://localhost
cors.allowMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowHeaders=*
cors.exposedHeaders=Authorization
cors.maxAge=3600
cors.allowCredentials=true
cors.mapping=/**