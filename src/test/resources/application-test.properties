# Base H2 temporal y aislada para las pruebas de integración.
spring.datasource.url=jdbc:h2:mem:sysinvent;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.jpa.open-in-view=false

# Seguridad utilizada solamente durante las pruebas.
jwt.secret=SysInvent-test-secret-key-with-at-least-32-bytes
jwt.expiration-ms=3600000
app.security.initial-user-password=SysInventTest2026!
initial-admin.password=

# Brevo permanece deshabilitado durante las pruebas de integración.
brevo.enabled=false
brevo.api-url=https://api.brevo.com/v3/smtp/email
brevo.api-key=
brevo.sender.email=
brevo.sender.name=SysInvent

# CORS para las pruebas.
cors.allowOrigins=http://localhost
cors.allowMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowHeaders=*
cors.exposedHeaders=Authorization
cors.maxAge=3600
cors.allowCredentials=true
cors.mapping=/**
